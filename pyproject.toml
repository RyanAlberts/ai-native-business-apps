[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-native-business-apps"
version = "0.1.0"
description = "Keel — the open-source AI back-office for founders. Incorporate, bank, and stay compliant from Day 0. The open-source alternative to Stripe Atlas."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ryan Alberts", email = "ryan.a.alberts@gmail.com" }]
keywords = ["ai", "agents", "startup", "claude", "openai", "gemini", "founder"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "claude-agent-sdk>=0.1.72",
    "anyio>=4.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "streamlit>=1.30",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
gemini = ["google-genai>=0.3"]
xai = ["openai>=1.30"]
ollama = ["ollama>=0.3"]
all-providers = [
    "openai>=1.30",
    "google-genai>=0.3",
    "ollama>=0.3",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/RyanAlberts/ai-native-business-apps"
Issues = "https://github.com/RyanAlberts/ai-native-business-apps/issues"

[project.scripts]
keel = "core.cli:main"
agent = "core.cli:main"   # legacy alias — kept so existing docs/links work

[tool.setuptools.packages.find]
include = [
    "core*",
    "_template*",
    "starter_business_agents*",
    "advanced_business_agents*",
]
exclude = ["tests*", "tutorials*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md", "*.jsonl", "*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = [
    "core/tests",
    "advanced_business_agents/multi_agent_apps/founding_journey/tests",
]

