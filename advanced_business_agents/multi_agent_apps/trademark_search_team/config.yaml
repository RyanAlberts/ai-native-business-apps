# Trademark Search Team — provider config
provider: claude
model: claude-sonnet-4-6
auth_mode: subscription
temperature: 0.2     # Research synthesis — slight room for connecting findings, but no creative leaps.
max_tokens: 8192     # Synthesizer output is dense (verdict + table + pre-fill + deadlines).

mcp_servers: {}

# WebSearch is the critical capability — every research branch needs it
# to pull real TESS / state-SoS / common-law / Nice-class data. Without
# it, the agent will hallucinate trademark records (worse than no output).
allowed_tools:
  - WebSearch

extra:
  # Each research branch can make 5-8 WebSearch calls to triangulate.
  # The Claude Agent SDK counts each turn (LLM call + tool result) and
  # caps at this value. 8 is too low for branches that need to search
  # federal TESS + variations + state portals + common-law sites + the
  # USPTO ID Manual; 20 leaves headroom without being wasteful.
  max_turns: 20
